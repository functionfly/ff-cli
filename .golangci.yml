linters:
    enable:
        - errcheck
        - govet
        - staticcheck
        - gosimple
        - ineffassign
        - typecheck
        - gofmt
        - goimports
        - gocritic
        - revive
        - misspell
        - unconvert

linters-settings:
    goimports:
        local-prefixes: github.com/functionfly/ff-cli
    revive:
        rules:
            - name: exported
              severity: warning
    gocritic:
        disabled-checks:
            - appendAssign
            - ifElseChain
            - singleCaseSwitch
            - exitAfterDefer
    errcheck:
        exclude-functions:
            - (*github.com/spf13/cobra.Command).MarkFlagRequired
            - (*encoding/json.Encoder).Encode
            - fmt.Sscanf

issues:
    exclude-rules:
        - path: _test\.go
          linters:
              - errcheck
              - unparam
        - path: internal/testing/
          linters:
              - revive
    max-issues-per-linter: 0
    max-same-issues: 0
